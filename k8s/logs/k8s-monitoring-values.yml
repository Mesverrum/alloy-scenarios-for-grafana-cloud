---
cluster:
  name: alloy-scenarios-cloud

destinations:
  loki:
    type: loki
    urlFrom: sys.env("GC_LOKI_URL")
    auth:
      type: basic
      usernameFrom: sys.env("GC_LOKI_USER")
      passwordFrom: sys.env("GC_TOKEN")

clusterEvents:
  enabled: true
  collector: alloy-singleton
  namespaces:
    - meta
    - prod

podLogsViaKubernetesApi:
  enabled: true
  collector: alloy-logs
  namespaces:
    - meta
    - prod
  structuredMetadata:
    pod: pod

collectors:
  alloy-singleton:
    presets: [singleton]
    extraEnvFrom:
      - secretRef:
          name: grafana-cloud
  alloy-logs:
    presets: [clustered]
    extraEnvFrom:
      - secretRef:
          name: grafana-cloud
