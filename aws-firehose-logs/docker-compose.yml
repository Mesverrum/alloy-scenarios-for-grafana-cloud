services:

  alloy:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.17.1}
    env_file:
      - ../.env
    environment:
      GC_DESTINATIONS_FILE: /etc/alloy/cloud/destinations.alloy
    ports:
      - "12345:12345"
      - "9999:9999"
    volumes:
      - ../_cloud/destinations.alloy:/etc/alloy/cloud/destinations.alloy
      - ./config.alloy:/etc/alloy/config.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

  firehose-sender:
    image: python:${PYTHON_VERSION:-3.11-slim}
    volumes:
      - ./firehose_sender.py:/firehose_sender.py:ro
    environment:
      - ALLOY_FIREHOSE_URL=http://alloy:9999/awsfirehose/api/v1/push
      - INTERVAL_SECONDS=5
      - EVENTS_PER_BATCH=8
    depends_on:
      - alloy
    command: ["python3", "-u", "/firehose_sender.py"]
    restart: unless-stopped
