version: '3.8'

services:
  alloy:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.17.1}
    env_file:
      - ../.env
    environment:
      GC_DESTINATIONS_FILE: /etc/alloy/cloud/destinations.alloy
    ports:
      - 8888:8888
      - 4317:4317/tcp
      - 4318:4318/tcp
      - 12345:12345     # Alloy UI
    volumes:
      - ../_cloud/destinations.alloy:/etc/alloy/cloud/destinations.alloy
      - ./config-otel.yaml:/etc/alloy/config-otel.yaml
      - ./config.alloy:/etc/alloy/config.alloy
    command: otel --config=/etc/alloy/config-otel.yaml

  log-generator:
    image: python:${PYTHON_VERSION:-3.11-slim}
    volumes:
      - ./app/generate_logs.py:/app/generate_logs.py
      - ./app/requirements.txt:/app/requirements.txt
    command:
      - sh
      - -c
      - "pip install -r /app/requirements.txt && python /app/generate_logs.py"
    depends_on:
      - alloy

