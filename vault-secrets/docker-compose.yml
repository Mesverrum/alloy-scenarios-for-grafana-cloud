services:
  vault:
    image: hashicorp/vault:${VAULT_VERSION:-2.0.3}
    container_name: vault-secrets-vault
    ports:
      - "8200:8200"
    env_file:
      - ../.env
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
      VAULT_TOKEN: root-token-for-demo
    entrypoint:
      - sh
      - -euc
      - |
        vault server -dev \
          -dev-listen-address=0.0.0.0:8200 \
          -dev-root-token-id=root-token-for-demo &
        VAULT_PID=$$!
        until vault status >/dev/null 2>&1; do sleep 1; done
        vault kv put secret/alloy/remote-write \
          username="$$GC_PROM_USER" \
          password="$$GC_TOKEN"
        echo "seeded Cloud remote_write credentials from GC_PROM_USER / GC_TOKEN"
        wait $$VAULT_PID
    healthcheck:
      test: ["CMD", "sh", "-c", "vault kv get secret/alloy/remote-write >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20

  alloy:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.17.1}
    env_file:
      - ../.env
    environment:
      GC_DESTINATIONS_FILE: /etc/alloy/cloud/destinations.alloy
    container_name: vault-secrets-alloy
    ports:
      - "12345:12345"
    volumes:
      - ../_cloud/destinations.alloy:/etc/alloy/cloud/destinations.alloy
      - ./config.alloy:/etc/alloy/config.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      vault:
        condition: service_healthy
