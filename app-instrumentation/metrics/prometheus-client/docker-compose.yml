services:
  # ── Online-store services, each exposing /metrics via its language's native
  # Prometheus client library on port 9100. Alloy scrapes them by service name.
  python:
    build: ./python
    restart: unless-stopped

  node:
    build: ./node
    restart: unless-stopped

  go:
    build: ./go
    restart: unless-stopped

  java:
    build: ./java
    restart: unless-stopped

  csharp:
    build: ./csharp
    restart: unless-stopped

  # ── Telemetry pipeline ──
  alloy:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.17.1}
    env_file:
      - ../.env
    environment:
      GC_DESTINATIONS_FILE: /etc/alloy/cloud/destinations.alloy
    ports:
      - 12345:12345  # Alloy UI
    volumes:
      - ../_cloud/destinations.alloy:/etc/alloy/cloud/destinations.alloy
      - ./config.alloy:/etc/alloy/config.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

  # ── Storage ──
networks:
  default:
    name: metrics-prometheus-network
