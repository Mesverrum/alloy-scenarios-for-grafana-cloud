#
# OTel Collector YAML Configuration for Tail Sampling
#
# This is the OTel-native equivalent of config.alloy for use with the Alloy OTel Engine.
# Run with: docker compose -f docker-compose.yml -f docker-compose-otel.yml up -d
#

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Tail Sampling: wait for complete traces before making sampling decisions
  tail_sampling:
    decision_wait: 10s
    num_traces: 100
    expected_new_traces_per_sec: 10
    sample_on_first_match: true
    decision_cache:
      sampled_cache_size: 1000
      non_sampled_cache_size: 10000
    policies:
      - name: test-attribute-policy
        type: string_attribute
        string_attribute:
          key: test_attr_key_1
          values: [test_attr_val_1]

      - name: error-policy
        type: status_code
        status_code:
          status_codes: [ERROR]

      - name: latency-policy
        type: latency
        latency:
          threshold_ms: 5000

      - name: numeric-policy
        type: numeric_attribute
        numeric_attribute:
          key: key1
          min_value: 70
          max_value: 100

      - name: drop-probes
        type: drop
        drop:
          drop_sub_policy:
            - name: probe-urls
              type: string_attribute
              string_attribute:
                key: http.url
                values: ["/health", "/metrics"]
                enabled_regex_matching: true

      - name: slow-errors
        type: and
        and:
          and_sub_policy:
            - name: is-error
              type: status_code
              status_code:
                status_codes: [ERROR]
            - name: is-slow
              type: latency
              latency:
                threshold_ms: 1000

      - name: login-ottl
        type: ottl_condition
        ottl_condition:
          error_mode: ignore
          span:
            - 'attributes["http.url"] == "/login"'

      - name: probabilistic-policy
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  batch: {}

exporters:
  otlp/tempo:
    endpoint: ${env:GC_OTLP_URL}
    tls:
      insecure: false

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [tail_sampling, batch]
      exporters: [otlp/tempo]
