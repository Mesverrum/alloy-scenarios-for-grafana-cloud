services:
  nginx:
    image: nginx:${NGINX_VERSION:-1.31-alpine}
    container_name: nginx-monitoring-nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx-data

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:${NGINX_EXPORTER_VERSION:-1.5.1}
    container_name: nginx-monitoring-exporter
    command:
      - --nginx.scrape-uri=http://nginx:80/nginx_status
    ports:
      - "9113:9113"
    depends_on:
      - nginx

  loadgen:
    image: curlimages/curl:${CURL_VERSION:-8.21.0}
    container_name: nginx-monitoring-loadgen
    entrypoint:
      - sh
      - -c
      - |
        until curl -s -o /dev/null --max-time 2 http://nginx/; do sleep 1; done
        while true; do
          curl -s -o /dev/null http://nginx/
          curl -s -o /dev/null http://nginx/missing-page
          sleep 1
        done
    depends_on:
      - nginx
    restart: unless-stopped

  alloy:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.17.1}
    container_name: nginx-monitoring-alloy
    ports:
      - "12345:12345"
    env_file:
      - ../.env
    environment:
      GC_DESTINATIONS_FILE: /etc/alloy/cloud/destinations.alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - ../_cloud/destinations.alloy:/etc/alloy/cloud/destinations.alloy
      - nginx-logs:/var/log/nginx-data:ro
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - nginx
      - nginx-exporter

volumes:
  nginx-logs:
