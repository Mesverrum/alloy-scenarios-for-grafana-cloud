#
# OTel Collector YAML Configuration for OpenTelemetry Metrics Pipeline
#
# This is the OTel-native equivalent of config.alloy for use with the Alloy OTel Engine.
# Run with: docker compose -f docker-compose.yml -f docker-compose-otel.yml up -d
#

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  filter/drop_noise:
    error_mode: ignore
    metrics:
      datapoint:
        - attributes["endpoint"] == "/health"

  batch: {}

  transform:
    error_mode: ignore
    metric_statements:
      - context: resource
        statements:
          - set(attributes["deployment.environment"], "demo")

exporters:
  otlphttp/prometheus:
    endpoint: ${env:GC_OTLP_URL}
    tls:
      insecure: false

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [filter/drop_noise, batch, transform]
      exporters: [otlphttp/prometheus]
