services:

  # LocalStack emulates the CloudWatch + STS APIs locally.
  # No real AWS account or credentials needed.
  localstack:
    image: localstack/localstack:${LOCALSTACK_VERSION:-4.14.0}
    ports:
      - "4566:4566"
    environment:
      - SERVICES=cloudwatch,sts
      - DEFAULT_REGION=us-east-1
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15

  # Pushes synthetic EC2/CPUUtilization data into LocalStack every 30 s.
  metric-seeder:
    image: python:${PYTHON_VERSION:-3.11-slim}
    volumes:
      - ./seed-metrics.py:/seed-metrics.py:ro
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - INTERVAL_SECONDS=30
    command: >
      sh -c "pip install boto3 --quiet && python -u /seed-metrics.py"
    depends_on:
      localstack:
        condition: service_healthy
    restart: unless-stopped

  alloy:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.17.1}
    env_file:
      - ../.env
    environment:
      GC_DESTINATIONS_FILE: /etc/alloy/cloud/destinations.alloy
    ports:
      - "12345:12345"
    volumes:
      - ../_cloud/destinations.alloy:/etc/alloy/cloud/destinations.alloy
      - ./config.alloy:/etc/alloy/config.alloy
    environment:
      # Point AWS SDK v2 at LocalStack instead of real AWS endpoints.
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      localstack:
        condition: service_healthy
        condition: service_started
