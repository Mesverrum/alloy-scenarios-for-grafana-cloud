services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:86cc6144ef39bb0fbed2329e1ad79b13ee82e7b2e4739213a0db0800e668a74a
    platform: linux/amd64
    hostname: mssql
    cpuset: "0-3"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Alloy-Demo-Pass123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "Alloy-Demo-Pass123!", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  mssql-load:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:86cc6144ef39bb0fbed2329e1ad79b13ee82e7b2e4739213a0db0800e668a74a
    platform: linux/amd64
    depends_on:
      mssql:
        condition: service_healthy
    restart: unless-stopped
    entrypoint:
      - bash
      - -c
      - |
        /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P 'Alloy-Demo-Pass123!' \
          -Q "IF DB_ID('demo') IS NULL CREATE DATABASE demo"
        /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P 'Alloy-Demo-Pass123!' -d demo \
          -Q "IF OBJECT_ID('dbo.events','U') IS NULL CREATE TABLE dbo.events (id INT IDENTITY PRIMARY KEY, at DATETIME2 DEFAULT SYSUTCDATETIME(), value FLOAT)"
        echo "demo schema ready - generating insert load"
        while true; do
          /opt/mssql-tools18/bin/sqlcmd -C -S mssql -U sa -P 'Alloy-Demo-Pass123!' -d demo \
            -Q "INSERT INTO dbo.events (value) VALUES (RAND())" >/dev/null
          sleep 1
        done

  alloy:
    image: grafana/alloy:${GRAFANA_ALLOY_VERSION:-v1.17.1}
    ports:
      - 12345:12345
    env_file:
      - ../.env
    environment:
      GC_DESTINATIONS_FILE: /etc/alloy/cloud/destinations.alloy
      MSSQL_CONNECTION_STRING: sqlserver://sa:Alloy-Demo-Pass123!@mssql:1433?encrypt=true&trustservercertificate=true
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy
      - ./mssql-queries.yaml:/etc/alloy/mssql-queries.yaml
      - ../_cloud/destinations.alloy:/etc/alloy/cloud/destinations.alloy
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      mssql:
        condition: service_healthy
